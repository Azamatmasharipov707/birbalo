<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecoDonate - Make a Difference</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar" id="navbar">
        <div class="container">
            <!-- Logo Section -->
            <a href="#" class="logo">
                <span class="logo-icon">🌿</span>
                <span class="logo-text">eco<span class="highlight">Donate</span></span>
            </a>

            <!-- Navigation Links -->
            <nav class="nav-links">
                <a href="#home" class="nav-link active">Home</a>
                <a href="#campaigns" class="nav-link">Campaigns</a>
                <a href="#impact" class="nav-link">Our Impact</a>
                <a href="#about" class="nav-link">About Us</a>
            </nav>

            <!-- Call to Action Button -->
            <div class="nav-actions">
                <a href="#donate" class="btn btn-donate">
                    <span>Donate Now</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <!-- Placeholder Hero Section for visual context -->
    <main class="hero">
        <div class="hero-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>
        <div class="hero-content">
            <span class="badge">Join the movement</span>
            <h1>Protect the Planet, <br>Empower the <span class="gradient-text">Future</span></h1>
            <p>Every contribution makes a ripple. Join ecoDonate today and help us preserve our beautiful Earth for
                generations to come.</p>
            <div class="hero-actions">
                <a href="#donate" class="btn btn-donate btn-large">Start Contributing</a>
                <a href="#learn-more" class="btn btn-outline btn-large">Learn More</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
